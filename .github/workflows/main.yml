name: CI/CD - API a Docker Hub y AWS EC2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: awsappcontainers
  COVERAGE_MIN: 70

jobs:
  # ---------- 1. Pruebas unitarias/integración + cobertura ----------
  test:
    name: Pruebas y cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar dependencias
        run: dotnet restore Tests/AWSAppContainers.Tests/AWSAppContainers.Tests.csproj

      - name: Ejecutar pruebas con cobertura
        run: >
          dotnet test Tests/AWSAppContainers.Tests/AWSAppContainers.Tests.csproj
          --no-restore
          --logger "console;verbosity=normal"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Generar resumen de cobertura
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:"coverage" \
            -filefilters:"-*obj*" \
            -reporttypes:"TextSummary;MarkdownSummaryGithub;Html"
          echo "================ RESUMEN DE COBERTURA ================"
          cat coverage/Summary.txt
          cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Validar cobertura mínima (${{ env.COVERAGE_MIN }}%)
        run: |
          LINE=$(grep -m1 -oP 'Line coverage:\s*\K[0-9.]+' coverage/Summary.txt)
          echo "Cobertura de líneas: ${LINE}% (mínimo ${COVERAGE_MIN}%)"
          awk -v c="$LINE" -v m="$COVERAGE_MIN" 'BEGIN { exit (c+0 >= m+0) ? 0 : 1 }' \
            || { echo "::error::La cobertura ${LINE}% es menor al ${COVERAGE_MIN}% requerido"; exit 1; }

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  # ---------- 2. Pruebas de extremo a extremo con Playwright (frontend + backend) ----------
  e2e:
    name: Pruebas E2E con Playwright
    runs-on: ubuntu-latest
    env:
      BASE_URL: http://127.0.0.1:5000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: e2e/requirements.txt

      - name: Compilar la aplicación
        run: dotnet publish AWSAppContainers.csproj -c Release -o ./publish

      - name: Levantar la aplicación con una BD limpia
        run: |
          DB_PATH="$RUNNER_TEMP/e2e.db" TCP_PORT=0 ASPNETCORE_URLS="$BASE_URL" \
            nohup dotnet ./publish/AWSAppContainers.dll > "$RUNNER_TEMP/app.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null "$BASE_URL/api/health" && { echo "App arriba"; exit 0; }
            sleep 2
          done
          cat "$RUNNER_TEMP/app.log"; echo "::error::La aplicación no arrancó"; exit 1

      - name: Instalar Playwright
        working-directory: e2e
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Ejecutar pruebas E2E
        working-directory: e2e
        run: >
          python -m pytest -v
          --junitxml=results/junit.xml
          --html=results/playwright-report.html --self-contained-html

      - name: Publicar reporte de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/results/
            e2e/artifacts/

      - name: Log de la aplicación
        if: failure()
        run: cat "$RUNNER_TEMP/app.log"

  # ---------- 3. Registrar el resultado de las pruebas en OpenObserve ----------
  report-tests:
    name: Registrar pruebas en OpenObserve
    needs: [test, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Enviar evento a OpenObserve
        env:
          OO_URL: http://${{ secrets.EC2_HOST }}:5080
          OO_EMAIL: ${{ secrets.OPENOBSERVE_EMAIL }}
          OO_PASSWORD: ${{ secrets.OPENOBSERVE_PASSWORD }}
          STATUS: ${{ (needs.test.result == 'success' && needs.e2e.result == 'success') && 'success' || 'failure' }}
          UNIT: ${{ needs.test.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          payload=$(jq -nc \
            --arg status "$STATUS" --arg unit "$UNIT" --arg e2e "$E2E" \
            --arg branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" --arg sha "$GITHUB_SHA" --arg actor "$GITHUB_ACTOR" \
            --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg event_name "$GITHUB_EVENT_NAME" --arg run_id "$GITHUB_RUN_ID" \
            '[{event: "tests", status: $status, unit_tests: $unit, e2e_tests: $e2e, branch: $branch,
               commit_sha: $sha, actor: $actor, trigger: $event_name, run_id: $run_id, run_url: $run}]')
          echo "$payload"
          curl -fsS --max-time 20 -u "$OO_EMAIL:$OO_PASSWORD" -H "Content-Type: application/json" \
            -X POST "$OO_URL/api/default/cicd/_json" -d "$payload" \
            || echo "::warning::No se pudo registrar el evento en OpenObserve"

  # ---------- 4. Build y push a Docker Hub (solo si pasan todas las pruebas) ----------
  build-push:
    name: Construir y publicar imagen
    needs: [test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login en Docker Hub (PAT)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build y push (:latest y :sha)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------- 5. Despliegue en EC2 (app + OpenObserve + collector) ----------
  deploy:
    name: Desplegar en EC2
    needs: build-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Copiar archivos de despliegue
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: deploy/
          target: awsapp
          rm: true

      - name: Desplegar vía SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          OO_EMAIL: ${{ secrets.OPENOBSERVE_EMAIL }}
          OO_PASSWORD: ${{ secrets.OPENOBSERVE_PASSWORD }}
          JWT_KEY: ${{ secrets.JWT_KEY }}
          APP_VERSION: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE,OO_EMAIL,OO_PASSWORD,JWT_KEY,APP_VERSION
          command_timeout: 15m
          script: bash ~/awsapp/deploy/deploy.sh

      - name: Verificar que la API y el frontend responden
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          for _ in $(seq 1 10); do
            if curl -fsS -o /dev/null "http://$EC2_HOST/api/health" && curl -fsS -o /dev/null "http://$EC2_HOST/login.html"; then
              echo "API y frontend arriba"; exit 0
            fi
            sleep 5
          done
          echo "::error::La aplicación no respondió después del despliegue"; exit 1

  # ---------- 6. Registrar el despliegue en OpenObserve ----------
  report-deploy:
    name: Registrar despliegue en OpenObserve
    needs: deploy
    if: always() && needs.deploy.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Enviar evento a OpenObserve
        env:
          OO_URL: http://${{ secrets.EC2_HOST }}:5080
          OO_EMAIL: ${{ secrets.OPENOBSERVE_EMAIL }}
          OO_PASSWORD: ${{ secrets.OPENOBSERVE_PASSWORD }}
          STATUS: ${{ needs.deploy.result }}
        run: |
          payload=$(jq -nc \
            --arg status "$STATUS" --arg branch "$GITHUB_REF_NAME" --arg sha "$GITHUB_SHA" --arg actor "$GITHUB_ACTOR" \
            --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --arg run_id "$GITHUB_RUN_ID" \
            '[{event: "deploy", status: $status, branch: $branch, commit_sha: $sha, actor: $actor,
               target: "ec2", run_id: $run_id, run_url: $run}]')
          echo "$payload"
          curl -fsS --max-time 20 -u "$OO_EMAIL:$OO_PASSWORD" -H "Content-Type: application/json" \
            -X POST "$OO_URL/api/default/cicd/_json" -d "$payload" \
            || echo "::warning::No se pudo registrar el evento en OpenObserve"

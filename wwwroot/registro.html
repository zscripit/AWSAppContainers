<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear cuenta · AWS App Containers</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="auth-page">
  <form class="card" id="registro-form" data-testid="registro-form" novalidate>
    <h1>Crear cuenta</h1>
    <p class="subtitle">Regístrate para entrar al sistema.</p>

    <div class="alert" id="alert" data-testid="alert" role="alert" hidden></div>

    <div class="field">
      <label for="nombre">Nombre</label>
      <input id="nombre" name="nombre" autocomplete="name" required maxlength="100" data-testid="nombre">
    </div>
    <div class="field">
      <label for="email">Correo</label>
      <input id="email" name="email" type="email" autocomplete="email" required data-testid="email">
    </div>
    <div class="field">
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="new-password" required data-testid="password">
      <span class="hint">Mínimo 8 caracteres, con letras y números.</span>
    </div>
    <div class="field">
      <label for="confirmar">Confirmar contraseña</label>
      <input id="confirmar" name="confirmar" type="password" autocomplete="new-password" required data-testid="confirmar">
    </div>

    <button type="submit" class="block" data-testid="submit">Crear cuenta</button>
    <p class="switch">¿Ya tienes cuenta? <a href="/login.html" data-testid="go-login">Inicia sesión</a></p>
  </form>

  <script type="module">
    import { api, showAlert, hideAlert } from "/js/api.js";

    const form = document.getElementById("registro-form");
    const alert = document.getElementById("alert");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      hideAlert(alert);
      const body = { nombre: form.nombre.value.trim(), email: form.email.value.trim(), password: form.password.value };
      if (!body.nombre || !body.email || !body.password) return showAlert(alert, "Todos los campos son obligatorios");
      if (body.password !== form.confirmar.value) return showAlert(alert, "Las contraseñas no coinciden");

      const button = form.querySelector("button");
      button.disabled = true;
      try {
        await api("/api/auth/registro", { method: "POST", body });
        window.location.href = "/login.html?registrado=1";
      } catch (err) {
        showAlert(alert, err.message);
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>

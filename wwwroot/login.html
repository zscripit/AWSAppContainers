<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · AWS App Containers</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="auth-page">
  <form class="card" id="login-form" data-testid="login-form" novalidate>
    <h1>Iniciar sesion</h1>
    <p class="subtitle">Accede para administrar los usuarios.</p>

    <div class="alert" id="alert" data-testid="alert" role="alert" hidden></div>

    <div class="field">
      <label for="email">Correo</label>
      <input id="email" name="email" type="email" autocomplete="username" required data-testid="email">
    </div>
    <div class="field">
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required data-testid="password">
    </div>

    <button type="submit" class="block" data-testid="submit">Entrar</button>
    <p class="switch">¿No tienes cuenta? <a href="/registro.html" data-testid="go-registro">Regístrate</a></p>
  </form>

  <script type="module">
    import { api, session, showAlert, hideAlert } from "/js/api.js";

    if (session.token) window.location.replace("/usuarios.html");

    const form = document.getElementById("login-form");
    const alert = document.getElementById("alert");
    const params = new URLSearchParams(window.location.search);
    if (params.has("registrado")) showAlert(alert, "Cuenta creada. Ya puedes iniciar sesión.", "success");
    if (params.has("expirada")) showAlert(alert, "Tu sesión expiró. Inicia sesión de nuevo.");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      hideAlert(alert);
      const email = form.email.value.trim();
      const password = form.password.value;
      if (!email || !password) return showAlert(alert, "El correo y la contraseña son obligatorios");

      const button = form.querySelector("button");
      button.disabled = true;
      try {
        const [result] = await api("/api/auth/login", { method: "POST", body: { email, password } });
        session.save(result.token, result.usuario);
        window.location.href = "/usuarios.html";
      } catch (err) {
        showAlert(alert, err.message);
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>

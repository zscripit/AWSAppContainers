<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Usuarios · AWS App Containers</title>
  <link rel="stylesheet" href="/css/styles.css">
  <script>if (!localStorage.getItem("token")) window.location.replace("/login.html");</script>
</head>
<body>
  <header class="topbar">
    <span class="brand">AWS App Containers</span>
    <div class="session">
      <span id="current-user" data-testid="current-user"></span>
      <button class="secondary" id="logout" data-testid="logout">Cerrar sesión</button>
    </div>
  </header>

  <main>
    <h1>Usuarios</h1>
    <div class="alert" id="alert" data-testid="alert" role="alert" hidden></div>

    <div class="toolbar">
      <input id="buscar" type="search" placeholder="Buscar por nombre o correo" data-testid="buscar" aria-label="Buscar">
      <button id="nuevo" data-testid="nuevo">Nuevo usuario</button>
    </div>

    <div class="panel">
      <table data-testid="tabla-usuarios">
        <thead>
          <tr><th>ID</th><th>Nombre</th><th>Correo</th><th>Creado</th><th>Acciones</th></tr>
        </thead>
        <tbody id="filas"></tbody>
      </table>
      <p class="empty" id="vacio" data-testid="vacio" hidden>No hay usuarios que coincidan.</p>
    </div>
  </main>

  <dialog id="dialogo" data-testid="dialogo">
    <form id="usuario-form" method="dialog" novalidate>
      <h2 id="dialogo-titulo">Nuevo usuario</h2>
      <div class="alert" id="dialogo-alert" data-testid="dialogo-alert" role="alert" hidden></div>
      <div class="field">
        <label for="f-nombre">Nombre</label>
        <input id="f-nombre" name="nombre" required maxlength="100" data-testid="f-nombre">
      </div>
      <div class="field">
        <label for="f-email">Correo</label>
        <input id="f-email" name="email" type="email" required data-testid="f-email">
      </div>
      <div class="field">
        <label for="f-password">Contraseña</label>
        <input id="f-password" name="password" type="password" autocomplete="new-password" data-testid="f-password">
        <span class="hint" id="password-hint">Mínimo 8 caracteres, con letras y números.</span>
      </div>
      <div class="dialog-actions">
        <button type="button" class="secondary" id="cancelar" data-testid="cancelar">Cancelar</button>
        <button type="submit" id="guardar" data-testid="guardar">Guardar</button>
      </div>
    </form>
  </dialog>

  <dialog id="confirmar" data-testid="confirmar">
    <h2>Eliminar usuario</h2>
    <p id="confirmar-texto"></p>
    <div class="dialog-actions">
      <button type="button" class="secondary" id="confirmar-no" data-testid="confirmar-no">Cancelar</button>
      <button type="button" class="danger" id="confirmar-si" data-testid="confirmar-si">Eliminar</button>
    </div>
  </dialog>

  <script type="module" src="/js/usuarios.js"></script>
</body>
</html>
